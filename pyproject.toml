[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-time-market-events"
version = "0.1.0"
description = "Real-Time Market Events Stream — Kafka + Faust + TimescaleDB pipeline for crypto, forex, and stock market events."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Camerlengo" }
]
keywords = ["kafka", "faust", "timescaledb", "streaming", "market-events", "real-time"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# --- Core runtime dependencies (to be filled per issue) ---
dependencies = [
    # M1 - Ingesta & Kafka
    "websockets>=12.0",
    "httpx>=0.27.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # M2 - Stream Processing
    "faust-streaming>=0.10.0",

    # M3 - Persistencia & API
    # "asyncpg>=0.29.0",
    # "sqlalchemy[asyncio]>=2.0.30",
    # "alembic>=1.13.0",
    # "fastapi>=0.111.0",
    # "uvicorn[standard]>=0.30.0",

    # M4 - Observabilidad
    # "prometheus-client>=0.20.0",
    # "opentelemetry-sdk>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.24.0",
]
airflow = [
    # "apache-airflow>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/alejandrocamerlengo/real-time-market-events"
Repository = "https://github.com/alejandrocamerlengo/real-time-market-events"
Issues = "https://github.com/alejandrocamerlengo/real-time-market-events/issues"

# --- Ruff (linter + formatter) ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/*/__init__.py"]

[tool.coverage.report]
show_missing = true

# --- Hatch Build ---
[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/consumers",
    "src/extractors",
    "src/loaders",
    "src/producers",
    "src/schemas",
    "src/transformers"
]
